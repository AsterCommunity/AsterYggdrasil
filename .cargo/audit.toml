# cargo-audit 配置
# 仅列精确上游例外；包含无兼容修复的残留风险，不表示漏洞已经修复

[advisories]
ignore = [
    # rsa Marvin Attack (timing sidechannel)
    # 0.9.10 经 openidconnect / webauthn 传递引入，0.10.0-rc.x 经 crypto-glue / webauthn-authenticator-rs
    # 引入。Yggdrasil 服务端只做远端签名公钥验证，不调用 rsa crate 的私钥解密或签名，
    # 不暴露可观测的私钥时序 oracle。rsa 0.10.0 正式版移除了 crypto-glue 需要的 feature 集，
    # 在 crypto-glue / webauthn-rs 发布兼容版本前无法升级。
    # 上游状态：rsa crate 尚无与当前依赖树兼容的修复版本
    "RUSTSEC-2023-0071",

    # h2 0.3.27 unbounded empty DATA frames (RUSTSEC-2026-0258)
    # actix-http 3.x 仍依赖 h2 ^0.3；h2 0.4 不满足该依赖的 semver 约束，h2 0.3 线没有修复版本。
    # 待 actix-http 发布切换到 h2 >= 0.4.16 的版本后立即删除本项并刷新 Cargo.lock。
    "RUSTSEC-2026-0258",

    # libsqlite3-sys 0.37.0 via sqlx-sqlite (RUSTSEC-2026-0459)
    # RustSec 修复版本要求 >=0.39.0，当前 SeaORM/SQLx crates.io 发布线没有可用的兼容升级。
    # 待 SQLx 或 SeaORM 发布放宽并带入修复版本后刷新 Cargo.lock，并删除本项。
    "RUSTSEC-2026-0459",

    # astral-tokio-tar 0.6.4 unmaintained (RUSTSEC-2026-0440)
    # 由 testcontainers 0.28 引入，只在开发/容器 fixture 中使用，不在产品运行时依赖树。
    # 待 testcontainers 发布迁移受维护 tar 实现的版本后升级并删除本项。
    "RUSTSEC-2026-0440",

    # chrono 0.4.45 unmaintained (RUSTSEC-2026-0543)
    # 维护状态例外：SeaORM / actix / Forge 全生态仍以 chrono 为标准时间类型，项目无可用替代。
    # 本例外只接受维护告警，不代表 chrono 恢复维护。待生态迁移（如 jiff）后再评估。
    "RUSTSEC-2026-0543",

    # ttf-parser 0.25.1 unmaintained (RUSTSEC-2026-0192)
    # 由 image 0.25 传递引入，用于字体度量读取的维护状态例外。待 image 依赖更新后重估。
    "RUSTSEC-2026-0192",

    # paste 1.0.x unmaintained (RUSTSEC-2024-0436)
    # 传递使用的 token 拼接宏，非运行时解析器；维护状态例外，不声称上游恢复维护。
    # 待调用方迁移后移除。
    "RUSTSEC-2024-0436",
]
