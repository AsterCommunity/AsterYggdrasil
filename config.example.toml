# AsterYggdrasil static configuration example.
# The runtime default path is data/config.toml.
# Relative paths are resolved against data/ when the config file lives there.

[deployment]
# `single` permits instance-local cache/storage fallback. `cluster` requires
# PostgreSQL/MySQL, Redis cache, Redis config-sync, and S3/MinIO object storage.
profile = "single"

[server]
host = "127.0.0.1"
port = 3000
workers = 0
temp_dir = ".tmp"

[worker]
# Per-process shutdown budgets, in seconds. In-flight HTTP requests drain for
# drain_timeout_secs; background workers get drain plus cancellation (plus a
# small join margin) before the remaining ones are aborted. Their sum may not
# exceed 24 hours.
drain_timeout_secs = 20
cancellation_timeout_secs = 5

[database]
url = "sqlite://asteryggdrasil.db?mode=rwc"
# Structured credentials are also accepted and keep raw credentials out of
# debug output:
# url = { base_url = "postgres://db:5432/asteryggdrasil", username = "RAW_USERNAME", password = "RAW_PASSWORD" }
pool_size = 10
retry_count = 3

[auth]
jwt_secret = "replace-with-a-long-random-secret"
mfa_secret_key = "replace-with-another-long-random-secret"
# Per-process cap for concurrent Argon2 hash/verify jobs. Each job reserves
# about 64 MiB of working memory, so 2 allows roughly 128 MiB of concurrent
# Argon2 memory. Small instances can use 1; restart required. The default
# mirrors aster_forge_auth::DEFAULT_PASSWORD_HASH_MAX_CONCURRENCY.
password_hash_max_concurrency = 2
bootstrap_insecure_cookies = false

[cache]
backend = "memory"
endpoint = ""
default_ttl = 3600

[config_sync]
backend = "disabled"
endpoint = ""
topic = "aster_yggdrasil.config_reload"

[object_storage]
backend = "local"
local_root = "storage"

[object_storage.s3]
endpoint = ""
region = ""
bucket = ""
base_path = ""
access_key_id = ""
secret_access_key = ""
force_path_style = false

[logging]
level = "info"
format = "text"
file = ""
enable_rotation = true
max_backups = 5

# Exporters are off by default, including when upgrading a metrics-enabled build.
# Changes take effect at restart. Environment overrides use ASTER__OBSERVABILITY__*.
[observability]
# Replaces ASTER_DEPLOYMENT_ENVIRONMENT; override with ASTER__OBSERVABILITY__ENVIRONMENT.
environment = "production"

[observability.prometheus]
# Requires --features metrics. Scrape /health/metrics on the service listener.
# Restrict access to the scrape path with a reverse proxy or a private network.
enabled = false

[observability.prometheus.basic_auth]
# Optional Basic auth for the scrape route. Requires [observability.prometheus].
# password_hash is an Argon2id PHC verifier, not the password:
#   printf '%s\n' 'scrape-password' | asteryggdrasil hash-password
enabled = false
username = "prometheus"
password_hash = ""

[observability.otlp_metrics]
# Requires --features otlp-metrics. Use the complete OTLP HTTP metrics URL.
enabled = false
endpoint = "http://127.0.0.1:4318/v1/metrics"
interval_seconds = 60
timeout_seconds = 5

[observability.otlp_metrics.headers]
# Optional HTTP headers, such as Authorization. Use HTTPS with credentials.

[network_trust]
trusted_proxies = []

[rate_limit]
enabled = true

[rate_limit.auth]
seconds_per_request = 2
burst_size = 5

[rate_limit.public]
seconds_per_request = 1
burst_size = 30

[rate_limit.api]
seconds_per_request = 1
burst_size = 120

[rate_limit.write]
seconds_per_request = 2
burst_size = 10
