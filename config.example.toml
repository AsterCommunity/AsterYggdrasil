# AsterYggdrasil static configuration example.
# The runtime default path is data/config.toml.
# Relative paths are resolved against data/ when the config file lives there.

[deployment]
# `single` permits instance-local cache/storage fallback. `cluster` requires
# PostgreSQL/MySQL, Redis cache, Redis config-sync, and S3/MinIO object storage.
profile = "single"

[server]
host = "127.0.0.1"
port = 3000
workers = 0
temp_dir = ".tmp"

[database]
url = "sqlite://asteryggdrasil.db?mode=rwc"
# Structured credentials are also accepted and keep raw credentials out of
# debug output:
# url = { base_url = "postgres://db:5432/asteryggdrasil", username = "RAW_USERNAME", password = "RAW_PASSWORD" }
pool_size = 10
retry_count = 3

[auth]
jwt_secret = "replace-with-a-long-random-secret"
mfa_secret_key = "replace-with-another-long-random-secret"
bootstrap_insecure_cookies = false

[cache]
backend = "memory"
endpoint = ""
default_ttl = 3600

[config_sync]
backend = "disabled"
endpoint = ""
topic = "aster_yggdrasil.config_reload"

[object_storage]
backend = "local"
local_root = "storage"

[object_storage.s3]
endpoint = ""
region = ""
bucket = ""
base_path = ""
access_key_id = ""
secret_access_key = ""
force_path_style = false

[logging]
level = "info"
format = "text"
file = ""
enable_rotation = true
max_backups = 5

[network_trust]
trusted_proxies = []

[rate_limit]
enabled = true

[rate_limit.auth]
seconds_per_request = 2
burst_size = 5

[rate_limit.public]
seconds_per_request = 1
burst_size = 30

[rate_limit.api]
seconds_per_request = 1
burst_size = 120

[rate_limit.write]
seconds_per_request = 2
burst_size = 10
