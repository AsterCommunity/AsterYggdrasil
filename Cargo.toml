aster_forge_db = { workspace = true, features = ["audit-log", "mail-outbox", "runtime-component", "runtime-lease", "scheduled-task", "system-config"] }
aster_forge_db_migration = { workspace = true }
aster_forge_external_auth = { workspace = true, features = ["github", "google", "microsoft", "qq"] }
