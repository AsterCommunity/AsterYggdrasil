[workspace]
members = [".", "crates/aster_yggdrasil_migration", "crates/aster_yggdrasil_render", "crates/aster_yggdrasil_model", "crates/aster_yggdrasil_protocol", "crates/aster_yggdrasil_outbound"]

[workspace.package]
version = "0.1.0-beta.1"
authors = [
    "AptS-1547 <apts-1547@esaps.net>",
    "AptS-1548 <apts-1548@esaps.net>",
]
repository = "https://github.com/AsterCommunity/AsterYggdrasil"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aster_yggdrasil_render = { path = "crates/aster_yggdrasil_render" }
aster_yggdrasil_model = { path = "crates/aster_yggdrasil_model" }
aster_yggdrasil_migration = { path = "crates/aster_yggdrasil_migration" }
aster_yggdrasil_protocol = { path = "crates/aster_yggdrasil_protocol" }
aster_yggdrasil_outbound = { path = "crates/aster_yggdrasil_outbound" }
# Pin all Forge mechanisms together to the exact published crates.io versions;
# members add only their required features.
aster_forge_middleware = { version = "=0.1.0-alpha.4" }
aster_forge_observability = { version = "=0.1.0-alpha.4" }
aster_forge_alloc = { version = "=0.1.0-alpha.2" }
aster_forge_api = { version = "=0.1.0-alpha.2" }
aster_forge_api_docs_macros = { version = "=0.1.0-alpha.1" }
aster_forge_audit = { version = "=0.1.0-alpha.4" }
aster_forge_auth = { version = "=0.1.0-alpha.4" }
aster_forge_cache = { version = "=0.1.0-alpha.3", default-features = false }
aster_forge_config = { version = "=0.1.0-alpha.3" }
aster_forge_crypto = { version = "=0.1.0-alpha.3" }
aster_forge_db = { version = "=0.1.0-alpha.4", default-features = false }
aster_forge_db_migration = { version = "=0.1.0-alpha.2" }
aster_forge_external_auth = { version = "=0.1.0-alpha.4" }
aster_forge_http = { version = "=0.1.0-alpha.3" }
aster_forge_logging = { version = "=0.1.0-alpha.2" }
aster_forge_mail = { version = "=0.1.0-alpha.3" }
aster_forge_metrics = { version = "=0.1.0-alpha.4" }
aster_forge_panic = { version = "=0.1.0-alpha.3" }
aster_forge_runtime = { version = "=0.1.0-alpha.3" }
aster_forge_storage_core = { version = "=0.1.0-alpha.2" }
aster_forge_tasks = { version = "=0.1.0-alpha.3", default-features = false }
aster_forge_test = { version = "=0.1.0-alpha.4" }
aster_forge_utils = { version = "=0.1.0-alpha.3" }
aster_forge_validation = { version = "=0.1.0-alpha.1" }
actix-web = { version = "4.20.0", features = ["compress-brotli", "compress-gzip"] }
actix-multipart = "0.8.9"
actix-governor = "0.10"
actix-http = "3"
async-trait = "0.1"
aws-credential-types = { version = "1.3.1", features = ["hardcoded-credentials"] }
aws-sdk-s3 = { version = "1.161.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
base64 = "0.23"
criterion = "0.8"
captcha-rs = "0.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
dotenvy = "0.15"
fs2 = "0.4"
futures = "0.3"
getrandom = "0.4"
governor = "0.10"
hex = "0.4"
http = "0.2.12"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
num_cpus = "1.17.0"
parking_lot = "0.13"
rand = { version = "0.10.4", default-features = false, features = ["std", "std_rng", "thread_rng"] }
rand_08 = { package = "rand", version = "0.8" }
reqwest = { version = "0.13.5", features = ["stream", "json"] }
ring = "0.17"
# Keep the rc line: rsa 0.10.0 dropped the `sha2` feature that crypto-glue (webauthn
# chain) still requires, so 0.10.0 fails to resolve. Revisit when crypto-glue /
# webauthn-rs release a compatible version. See RUSTSEC-2023-0071 in .cargo/audit.toml.
rsa = { version = "^0.10.0-rc.18", features = ["sha1"] }
rust-embed = "8"
sea-orm = { version = "2.0.4", features = ["sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "macros", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
secrecy = "0.10"
sha1 = "0.11"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2"
testcontainers = { version = "0.28", features = ["reusable-containers"] }
tikv-jemallocator = { version = "0.7" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
toml = "1.2"
toml_edit = "0.25"
tracing = { version = "0.1.44", default-features = false }
utoipa = { version = "6.0.0", features = ["chrono", "actix_extras", "repr"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["actix-web"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.21", features = ["derive"] }
webauthn-rs = { version = "0.6.2", default-features = false, features = ["conditional-ui", "danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.6.2"
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }

[package]
name = "aster_yggdrasil"
description = "Self-hosted Minecraft skin site and Yggdrasil authentication server."
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition = "2024"
rust-version = "1.95.0"
publish = false

[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
debug = 1
panic = "unwind"
strip = false
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
# Keep function symbols for actionable production panic backtraces while
# leaving source-level debug information out of the distributed binary.
debug = 0
# Keep ordinary request/task panics from taking down every HTTP worker. Stack overflow and OOM
# remain process-fatal and must be prevented at their input/allocation boundaries.
panic = "unwind"
strip = "debuginfo"

# 压测/火焰图采样用：接近 release，但保留符号并关闭 LTO，方便 perf 展开栈。
# frame pointer 需要通过 RUSTFLAGS 传入：
# RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile profiling
[profile.profiling]
inherits = "release"
opt-level = 2
codegen-units = 1
debug = true
strip = false
lto = false
panic = "unwind"

[profile.release-performance]
inherits = "release"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Suppressions must remain observable: `expect` reports when its justification goes stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true
[features]
default = ["server"]
server = []
metrics = [
    "server",
    "dep:aster_forge_observability",
    "aster_forge_observability/prometheus",
    "aster_forge_metrics/allocator-metrics",
    "aster_forge_metrics/backend-prometheus",
    "aster_forge_metrics/runtime-health",
]
openapi = [
    "dep:utoipa",
    "dep:utoipa-swagger-ui",
    "aster_yggdrasil_model/openapi",
    "aster_yggdrasil_protocol/openapi",
    "aster_forge_api/openapi",
    "aster_forge_api_docs_macros/openapi",
    "aster_forge_config/openapi",
    "aster_forge_mail/openapi",
    "aster_forge_runtime/openapi",
    "aster_forge_tasks/openapi",
]
full = ["server", "metrics", "openapi"]
benchmarks = ["dep:criterion"]
jemalloc = ["dep:tikv-jemallocator", "aster_forge_alloc/jemalloc"]
jemalloc-stats = [
    "jemalloc",
    "aster_forge_alloc/jemalloc-stats",
]
jemalloc-profiling = ["jemalloc-stats", "tikv-jemallocator/profiling"]

