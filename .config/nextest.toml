[profile.default]
fail-fast = false
retries = 0

[profile.ci]
inherits = "default"
status-level = "fail"
final-status-level = "slow"

[profile.database]
inherits = "ci"
# PostgreSQL/MySQL integration tests share one testcontainer per backend. The Forge test helper
# reclaims per-test databases left by exited processes during the same nextest run.
test-threads = 4
slow-timeout = { period = "120s", terminate-after = 4 }
