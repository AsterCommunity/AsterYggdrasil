[package]
name = "aster_yggdrasil_render"
description = "Minecraft skin and cape rendering helpers."
version = "0.1.0-alpha.1"
homepage = "https://github.com/AsterCommunity/AsterYggdrasil/tree/master/crates/aster_yggdrasil_render"
authors.workspace = true
repository.workspace = true
license.workspace = true
edition = "2024"
rust-version = "1.95.0"
publish = true

[lints]
workspace = true
[dependencies]
image = { workspace = true, default-features = false, features = ["png", "webp"] }

[dev-dependencies]
sysinfo = { workspace = true }

[lib]
name = "aster_yggdrasil_render"
doctest = false

[[example]]
name = "render_skin_preview"
path = "examples/render_skin_preview.rs"
