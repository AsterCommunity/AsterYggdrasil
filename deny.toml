# cargo-deny 配置：Rust 依赖审计统一入口（licenses + bans + advisories + sources）
# 组织级统一自 cargo-audit 迁移；AsterDrive 同款基线（GPL 一律不放行）。

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# 仅列当前依赖树真实命中的上游例外；包含无兼容修复的残留风险，
# 不表示漏洞已经修复。上游发版后立即移除对应条目并刷新 Cargo.lock。
ignore = [
    # rsa Marvin Attack（时序侧信道）(RUSTSEC-2023-0071)
    # 0.9.x 经 openidconnect / webauthn 传递引入，0.10.0-rc.x 经 crypto-glue 引入。
    # Yggdrasil 服务端只做远端签名公钥验证，不调用 rsa crate 的私钥解密或签名，
    # 不暴露可观测的私钥时序 oracle。rsa 0.10.0 正式版移除了 crypto-glue 需要的
    # feature 集，在 crypto-glue / webauthn-rs / openidconnect 发布兼容版本前无法升级。
    "RUSTSEC-2023-0071",

    # h2 0.3.x unbounded empty DATA frames (RUSTSEC-2026-0258)
    # actix-http 3.x 仍依赖 h2 ^0.3；h2 0.4 不满足该依赖的 semver 约束。
    # 待 actix-http 发布切换到 h2 >= 0.4.16 后立即删除本项并刷新 Cargo.lock。
    "RUSTSEC-2026-0258",

    # cookie 0.16.x PrivateJar nonce reuse after fork (RUSTSEC-2026-0594)
    # Yggdrasil 从不调用 PrivateJar，actix 单进程 runtime 不 fork；
    # 受影响的加密代码不参与编译（默认/all-features 只启用 percent-encode）。
    # actix-web 4.x requires cookie ^0.16，0.18.3 不是兼容升级。
    # Actix 升级 cookie 后移除本项；启用 private/secure 前重新评估。
    "RUSTSEC-2026-0594",

    # chrono unmaintained (RUSTSEC-2026-0543)
    # 维护状态例外：SeaORM / actix / Forge 全生态仍以 chrono 为标准时间类型。
    # 只接受维护告警，不豁免 chrono 的其他安全公告；待生态迁移后再评估。
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "MIT-0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    # webauthn-rs / crypto-glue 系列；MPL-2.0 是文件级 copyleft，链接不受传染
    "MPL-2.0",
]
confidence-threshold = 0.8
# GPL 强 copyleft 与本项目 MIT OR Apache-2.0 分发方向冲突，不放行：
# actix-governor 0.10 起为 GPL-3.0-or-later（底层 governor crate 仍是 MIT OR Apache-2.0），
# 需以 governor 自写中间件替换，licenses 检查将保持失败直到替换完成。
# 跟踪 issue: https://github.com/AsterCommunity/AsterYggdrasil/issues/25
exceptions = [
    # Mozilla 根证书数据（Mozilla CA 证书库），仅数据非代码
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # 仅在 UEFI target 下被 getrandom 引用，实际分发目标（容器/服务器二进制）不编译
    { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
    # 仅 fuzz 工具链（libfuzzer）使用，不进入产品二进制；NCSA 为 OSI 批准宽松许可
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["AsterCommunity"]
